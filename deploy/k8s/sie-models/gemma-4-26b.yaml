# SIE model config for Gemma-4-26B-A4B-it (MoE: 26B params, ~4B active).
# GPU 3: dedicated worker. FP8 is REQUIRED — BF16 weights are ~52 GB (exceeds 48 GB).
#
# Prerequisites:
#   - Accept Google's Gemma license at huggingface.co/google/gemma-4-26B-A4B-it
#   - Set HF_TOKEN in providers.env (read-only token is sufficient)
#   - install-sie.sh will create the sie-hf-token k8s Secret from that token
#
# Mounted into sie-config by install-sie.sh at
#   /app/models/google__gemma-4-26B-A4B-it.yaml
sie_id: google/gemma-4-26B-A4B-it
hf_id: google/gemma-4-26B-A4B-it
inputs:
  text: true
  image: false
  audio: false
  video: false
tasks:
  generate:
    # Gemma 4 supports 128K context but we cap at 16K to bound KV memory.
    context_length: 16384
    max_output_tokens: 4096
    capabilities:
      grammar:
        - json_schema
        - regex
      streaming: true
      tools: true
max_sequence_length: 16384
profiles:
  default:
    adapter_path: sie_server.adapters.sglang.generation:SGLangGenerationAdapter
    max_batch_tokens: 8192
    kv_budget_tokens: 7168
    adapter_options:
      loadtime:
        # Online FP8 quantization: ~26 GB on 48 GB L40S (fits with room for KV).
        quantization: fp8
        mem_fraction_static: 0.80
        grammar_backend: outlines
        # Gemma-4's own chat template renders custom tools with its native
        # <|turn>/<|tool>/<|channel> control-token format (not JSON) — a
        # shape SIE's tool-call parser does not recognize (it expects
        # Hermes-style <tool_call>{"name": ..., "arguments": {...}}</tool_call>).
        # Same override as Llama-3.3 (see llama-3-70b.yaml): `inject_tool_prompt`
        # withholds `tools` from Gemma's own template and injects a system
        # message instructing the model to reply in SIE's existing Hermes
        # format instead. `tool_call_parser: hermes` then makes SIE parse the
        # (now Hermes-shaped) output correctly.
        #
        # KNOWN OPEN RISK (untested): Gemma's template also renders a
        # structural "<|channel>thought<channel|>" block at the start of any
        # assistant turn that follows a system message — independent of
        # whether tools are present. SIE's parser only scans for the literal
        # <tool_call> substring, so a leaked thought preamble likely won't
        # break tool-call *parsing*, but may leak chain-of-thought text into
        # the visible response before the actual answer. No clean template
        # toggle was found to suppress this (enable_thinking only adds
        # *extra* forced thinking, it doesn't gate this baseline scaffold).
        # Verify empirically; may need a Qwen3-style reasoning-stripping
        # follow-up if this shows up as garbled visible output.
        tool_call_parser: hermes
        inject_tool_prompt: true
