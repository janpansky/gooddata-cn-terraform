# SIE (Superlinked Inference Engine) self-hosted install for the local-inference
# environment — 1 sglang worker on a g6e.4xlarge (1x L40S 48GB).
#
# Chart: oci://ghcr.io/superlinked/charts/sie-cluster
# Install: ./install-sie.sh   (creates HF secret, applies model configs, runs helm)
#
# GPU layout (2 separate g6e.4xlarge nodes, each with 1x L40S 48GB):
#   Node A / GPU 0: vLLM         → Qwen3.6-27B FP8         (inference namespace)
#   Node B / GPU 0: SIE sglang-0 → Qwen3-14B BF16 + 4B LRU (~28.5 GB + LRU swap)
#
# Each pod requests nvidia.com/gpu:1. With only 1 GPU per node, Kubernetes
# automatically places vLLM and the SIE worker on separate nodes.
# SIE models are served through the gateway:
#   http://sie-gateway.sie.svc.cluster.local:8080/v1
#
# Cost: scale workers to 0 with ./down.sh (GPU nodes drain in ~10 min).
# Bring back with ./up.sh.

fullnameOverride: sie

keda:
  install: false

kube-prometheus-stack:
  install: false

observability:
  logs:
    install: false

kubernetes-event-exporter:
  install: false

autoscaling:
  enabled: false

serviceMonitor:
  enabled: false

ingress:
  enabled: false

gateway:
  auth:
    mode: none # in-cluster only — never expose this service externally

# g6e.4xlarge = 1x NVIDIA L40S 48GB, 16 vCPU, 128 GB RAM.
machineProfiles:
  l40s:
    gpuType: nvidia-l40s
    machineType: g6e.4xlarge
    spot: true

workers:
  common:
    platform: cuda12
    # Custom build with the Llama-3.3 tool-calling fix (inject_tool_prompt),
    # not yet upstreamed to ghcr.io/superlinked/sie-server. Built from
    # sie@ptom/llama-fix via packages/sie_server/Dockerfile.cuda12
    # (--build-arg BUNDLE=sglang). Revert to the chart default (remove this
    # block) once the fix lands upstream and the chart version is bumped.
    image:
      repository: 972873489489.dkr.ecr.us-east-1.amazonaws.com/local-inference/sie-server
      tag: ptom-llama-fix
      # We reuse this tag across iterative pushes (mutable ECR repo) instead
      # of minting a new tag per build. IfNotPresent (the chart default)
      # then reuses whatever's cached on the node — confirmed the hard way:
      # a rebuilt-and-repushed image under the same tag still ran the OLD
      # cached digest after a pod restart. Always guarantees a fresh pull.
      pullPolicy: Always
    # 27B FP8 loads in <10 min; 70B AWQ-INT4 loads in <20 min from S3 cache.
    # Keep timeout generous for cold first-start (full HuggingFace download).
    modelReadyTimeoutSec: 1800
    # Liveness budget must exceed modelReadyTimeoutSec (1800 s).
    # 70 * 30 = 2100 s > 1800 s.
    probes:
      liveness:
        initialDelaySeconds: 10
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 70
      readiness:
        periodSeconds: 5
        timeoutSeconds: 10
        failureThreshold: 60
    extraEnv:
      # LRU eviction threshold for multi-model GPU 2 (Qwen14B + 4B hot-swap).
      # 95% leaves models resident; the LRU monitor evicts only under real pressure.
      - name: SIE_MEMORY_PRESSURE_THRESHOLD_PERCENT
        value: "95"
      - name: SIE_MODEL_LOAD_TIMEOUT_S
        value: "1800"
      - name: SIE_ADAPTER_STARTUP_TIMEOUT_S
        value: "1800"
      - name: SIE_SERVER_STARTUP_TIMEOUT_S
        value: "1800"
      # HuggingFace token — required for gated models (Gemma-4-26B-A4B-it).
      # Secret is created by install-sie.sh from providers/providers.env (HF_TOKEN).
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: sie-hf-token
            key: HF_TOKEN
            optional: true  # safe to omit for public models
    # S3 model cache — weights survive GPU scale-to-zero; re-loading from S3
    # takes ~2 min vs ~20 min from HuggingFace. Node-role credentials (no IRSA).
    clusterCache:
      enabled: true
      url: s3://local-inference-model-cache-972873489489/models
  pools:
    l40s:
      enabled: true
      machineProfile: l40s
      gpuType: l40s
      nodeSelector:
        workload: inference
      tolerations:
        - key: workload
          value: inference
          effect: NoSchedule
      gpu:
        count: 1
        product: NVIDIA-L40S
      # g6e.4xlarge: 16 vCPU, 128 GB RAM. 1 worker (Qwen3-14B + 4B LRU).
      # vLLM runs on the other g6e.4xlarge node (inference namespace).
      resources:
        requests:
          cpu: "6"
          memory: "24Gi"
        limits:
          cpu: "14"
          memory: "96Gi"
      bundles:
        # 1 sglang worker — Qwen3-14B BF16 primary, Qwen3-4B-2507 LRU hot-swap.
        # SIE's sticky routing pins Qwen3-14B as the primary resident model.
        sglang:
          minReplicas: 1
          maxReplicas: 1
